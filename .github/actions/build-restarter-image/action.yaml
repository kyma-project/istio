name: 'Build Istio Restarter Image'
description: 'Builds the Istio restarter image'
inputs:
  restarter-image-name:
    description: 'Restarter image name used for creation of the restarter image'
    required: true
runs:
  using: "composite"
  steps:
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # 3.11.1
    - name: Build and Load
      uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # 6.18.0
      with:
        context: .
        file: restarter/Dockerfile
        platforms: 'linux/amd64'
        push: false
        load: true
        tags: ${{ inputs.restarter-image-name }}
        cache-from: type=gha,scope=istio-restarter
        cache-to: type=gha,scope=istio-restarter,mode=max
        outputs: type=docker,dest=/tmp/restarter-image.tar
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: restarter-image
        path: /tmp/restarter-image.tar
