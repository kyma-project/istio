name: E2E dualstack

# Two entry points, both run the full e2e matrix on a dualstack shoot:
#   1. workflow_dispatch — manual kickoff from the Actions UI.
#   2. pull_request labeled 'dualstack' — automatic on labeled PRs.
# IPv4 is already covered by the standard PR gate, so this workflow is
# dualstack-only. Each matrix entry provisions its own shoot; label the PR
# only when you want to pay that cost.

on:
  workflow_dispatch:
  pull_request:
    types: [ labeled, synchronize, reopened ]

concurrency:
  # One in-flight run per ref keeps a re-push from stacking shoots.
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  IMAGE_NAME: "istio-manager"
  LABEL_NAME: "dualstack"
  # Fixed for this workflow — IPv4 is exercised by the standard PR gate,
  # so there is no reason to run this pipeline in any other mode.
  TEST_IP_FAMILY: "dualstack"

jobs:
  # PR events fire on every synchronize regardless of labels; gate the
  # actual work on the label being present, so unlabeled PRs pay only a
  # cheap no-op job.
  check-label:
    name: Check label
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        env:
          EVENT_NAME: ${{ github.event.name }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "${{ contains(github.event.pull_request.labels.*.name, 'dualstack') }}" = "true" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  build-image:
    name: Build manager image
    needs: [ check-label ]
    if: needs.check-label.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/build-manager-image
        with:
          # PR path tags with PR-N so the image lines up with the rest of
          # the PR gate; dispatch path falls back to the run id.
          operator-image-name: "istio-manager:PR-${{ github.event.number || github.run_id }}"
          operator-version: "PR-${{ github.event.number || github.run_id }}"

  get-image:
    name: Get manager image
    runs-on: ubuntu-latest
    needs: [ build-image ]
    outputs:
      image: "${{ steps.get-image.outputs.image }}"
      operator_version: "${{ steps.get-image.outputs.operator_version }}"
    steps:
      - id: get-image
        name: Get image for tests
        shell: bash
        env:
          TAG: "PR-${{ github.event.number || github.run_id }}"
        run: |
          echo "image=${IMAGE_NAME}:${TAG}" >> "$GITHUB_OUTPUT"
          echo "operator_version=${TAG}" >> "$GITHUB_OUTPUT"

  istio-e2e-dualstack:
    name: Istio E2E test (dualstack) ${{ matrix.test_make_target }}
    environment:
      name: e2e
      deployment: false
    runs-on: ubuntu-latest
    needs: [ get-image ]
    strategy:
      # Keep sibling suites alive so a single flaky suite doesn't hide the
      # rest of the breakage catalogue on first dualstack contact.
      fail-fast: false
      matrix:
        # Mirrors istio-e2e-test-aws in schedule-main-integration.yaml —
        # the suites already run on Gardener AWS in main integration are
        # the meaningful set for dualstack coverage. k3d-only suites
        # (installation, mesh_communication, observability, extauth,
        # egress, smoke_test, ambient) are LB-agnostic in that pipeline
        # and would not gain dualstack signal.
        test_make_target:
          - "xff_header-e2e-test"
          - "networkpolicy-e2e-test"
          - "dnsproxying-e2e-test"
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/e2e-test-gardener-dualstack
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          manager_image: ${{ needs.get-image.outputs.image }}
          gardener_secret: ${{ secrets.GARDENER_TOKEN }}
          gardener_project_name: ${{ vars.GARDENER_PROJECT_NAME }}
          test_make_target: ${{ matrix.test_make_target }}
          test_ip_family: ${{ env.TEST_IP_FAMILY }}
          operator_version: ${{ needs.get-image.outputs.operator_version }}
