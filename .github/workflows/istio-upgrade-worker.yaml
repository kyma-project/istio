name: Istio Upgrade Worker

# Branch-context worker for the scheduled Istio patch upgrade. It is never run
# directly on a schedule; the schedule-istio-upgrade.yaml orchestrator
# dispatches it once per target branch with --ref <branch>. Because of that
# --ref, this workflow file, hack/ci/upgrade-istio.sh, and the checkout all
# come from the dispatched branch, so the upgrade is computed and committed in
# that branch's own context. It can also be dispatched by hand to test a single
# branch.

permissions:
  contents: write
  pull-requests: write

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  upgrade-istio:
    name: Upgrade Istio on ${{ github.ref_name }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # full history + tags: release-note draft/create detection reads tags

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version-file: "go.mod"

      - name: Perform Istio upgrade
        id: upgrade
        shell: bash
        run: |
          istio_version_file=$(mktemp)
          pr_body_file=$(mktemp)
          echo "istio_version_file=${istio_version_file}" >> "${GITHUB_OUTPUT}"
          echo "pr_body_file=${pr_body_file}"             >> "${GITHUB_OUTPUT}"

          bash ./hack/ci/upgrade-istio.sh \
            "${istio_version_file}" "${pr_body_file}"

          if [ -s "${pr_body_file}" ]; then
            echo "Istio has been upgraded to $(cat "${istio_version_file}")"
            echo "has_changes=true" >> "${GITHUB_OUTPUT}"
          else
            echo "Istio is already up to date, nothing to do"
            echo "has_changes=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Commit and create pull request
        if: steps.upgrade.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ vars.ACTIONS_BOT_NAME }}
          EMAIL: ${{ vars.ACTIONS_BOT_EMAIL }}
          ISTIO_VERSION_FILE: ${{ steps.upgrade.outputs.istio_version_file }}
          PR_BODY_FILE: ${{ steps.upgrade.outputs.pr_body_file }}
        shell: bash
        run: |
          set -euo pipefail

          base="${{ github.ref_name }}"
          ISTIO_VERSION=$(cat "${ISTIO_VERSION_FILE}")
          branch="autobump/istio-upgrade-${base}"
          title="Bump Istio to ${ISTIO_VERSION} (${base})"

          git config user.name "${USERNAME}"
          git config user.email "${EMAIL}"

          git checkout -B "${branch}"
          git add config/manager/env-images.yaml \
                  internal/istiooperator/istio-operator.yaml \
                  internal/istiooperator/istio-operator-light.yaml \
                  internal/reconciliations/istioresources/gateway_api_crds/ \
                  component-config.yaml \
                  go.mod go.sum
          git commit -m "Bump Istio to ${ISTIO_VERSION}"
          git push -f -u origin "${branch}"

          existing="$(gh pr list --head "${branch}" --base "${base}" --state open --json number --jq '.[0].number')"
          if [ -n "${existing}" ]; then
            gh pr edit "${existing}" --title "${title}" --body-file "${PR_BODY_FILE}"
          else
            gh pr create \
              --base "${base}" \
              --head "${branch}" \
              --title "${title}" \
              --body-file "${PR_BODY_FILE}"
          fi
