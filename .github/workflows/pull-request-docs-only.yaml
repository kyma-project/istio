name: Pull Request (docs only)

# Handles PRs that change only documentation files (*.md, *.txt).
# If the PR contains non-doc changes, this workflow skips and pull-request.yaml
# runs the full test suite instead.

permissions:
  contents: read

on:
  pull_request:
    types: [ synchronize, opened, reopened, ready_for_review ]
    paths:
      - "**/*.md"
      - "**/*.txt"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  detect-scope:
    name: Detect scope
    runs-on: ubuntu-latest
    outputs:
      docs-only: ${{ steps.check.outputs.docs-only }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          changed="$(gh pr diff --name-only "${PR_NUMBER}" --repo "${{ github.repository }}")"
          echo "Changed files:"
          echo "${changed}"
          non_doc="$(echo "${changed}" | grep -vE '\.(md|txt)$' || true)"
          if [ -z "${non_doc}" ]; then
            echo "docs-only=true" >> "${GITHUB_OUTPUT}"
            echo "Only documentation files changed"
          else
            echo "docs-only=false" >> "${GITHUB_OUTPUT}"
            echo "Non-doc files changed — full PR pipeline will handle this"
          fi

  check-docs:
    name: Check docs
    needs: [ detect-scope ]
    if: needs.detect-scope.outputs.docs-only == 'true'
    runs-on: ubuntu-latest
    steps:
      - run: echo "Documentation-only change; no tests required."

  pull-request-status:
    needs: [ detect-scope, check-docs ]
    if: needs.detect-scope.outputs.docs-only == 'true'
    runs-on: ubuntu-latest
    steps:
      - if: ${{ !(contains(needs.*.result, 'failure')) }}
        run: exit 0
      - if: ${{ contains(needs.*.result, 'failure') }}
        run: exit 1
