name: Pull Request

permissions:
  contents: read

on:
  pull_request:
    types: [ synchronize, opened, reopened, ready_for_review ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true
  
env:
  GITLEAKS_VERSION: 8.21.0
  IMAGE_NAME: "istio-manager"

jobs:
  detect-scope:
    name: Detect scope
    runs-on: ubuntu-latest
    outputs:
      has-docs: ${{ steps.check.outputs.has-docs }}
      has-images: ${{ steps.check.outputs.has-images }}
      has-code: ${{ steps.check.outputs.has-code }}
      has-pipeline: ${{ steps.check.outputs.has-pipeline }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          changed="$(gh pr diff --name-only "${PR_NUMBER}" --repo "${{ github.repository }}")"

          if echo "${changed}" | grep -qE '\.(md|txt)$'; then
            echo "Detected documentation changes"
            echo "has-docs=true" >> "${GITHUB_OUTPUT}"
          fi

          if echo "${changed}" | grep -qE '^(external-images|fips-images)\.yaml$'; then
            echo "Detected image changes"
            echo "has-images=true" >> "${GITHUB_OUTPUT}"
          fi

          if echo "${changed}" | grep -qE '^(api|cmd|config|docker|internal|pkg|tests|crd-ref-docs)/|^(Dockerfile|go\.mod|go\.sum|component-config\.yaml)$'; then
            echo "Detected code changes"
            echo "has-code=true" >> "${GITHUB_OUTPUT}"
          fi

          if echo "${changed}" | grep -qE '^(hack|\.github)/|^(MINOR_VERSION|Makefile)$'; then
            echo "Detected pipeline changes"
            echo "has-pipeline=true" >> "${GITHUB_OUTPUT}"
          fi

  check-docs:
    name: Check docs
    runs-on: ubuntu-latest
    needs: [ detect-scope ]
    if: needs.detect-scope.outputs.has-docs == 'true' || needs.detect-scope.outputs.has-pipeline == 'true'
    steps:
      - run: echo "Documentation files changed; no tests required."

  check-images:
    name: Check images
    runs-on: ubuntu-latest
    needs: [ detect-scope ]
    if: needs.detect-scope.outputs.has-images == 'true' || needs.detect-scope.outputs.has-pipeline == 'true'
    steps:
      - uses: actions/checkout@v7
      - name: Check images exist on Docker Hub
        run: hack/ci/check-dockerhub-images.sh
      - name: Check Istio image versions are consistent
        run: hack/ci/check-istio-images-consistency.sh

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Fetch gitleaks ${{ env.GITLEAKS_VERSION }}
        run: curl -Lso gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v${{ env.GITLEAKS_VERSION }}/gitleaks_${{ env.GITLEAKS_VERSION }}_linux_x64.tar.gz && tar -xvzf ./gitleaks.tar.gz
      - name: Run gitleaks
        # Scan commits between base and head of the pull request
        run: ./gitleaks detect --log-opts=${PULL_BASE_SHA}...${PULL_HEAD_SHA} --verbose --redact
        env:
          PULL_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PULL_HEAD_SHA: ${{ github.event.pull_request.head.sha }}

  build-image:
    name: Build manager image
    runs-on: ubuntu-latest
    needs: [ detect-scope ]
    if: needs.detect-scope.outputs.has-code == 'true' || needs.detect-scope.outputs.has-pipeline == 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/build-manager-image
        with:
          operator-image-name: "istio-manager:PR-${{github.event.number}}"
          operator-version: "PR-${{github.event.number}}"

  get-image:
    name: Get manager image
    runs-on: ubuntu-latest
    needs: [ build-image ]
    outputs:
      image: "${{ steps.get-image.outputs.image }}"
      operator_version: "${{ steps.get-image.outputs.operator_version }}"
    steps:
      - id: get-image
        name: Get image for tests
        shell: bash
        env:
          PR_NUMBER: ${{github.event.number}}
        run: |
          image="${IMAGE_NAME}:PR-${PR_NUMBER}"
          operator_version="PR-${PR_NUMBER}"
          echo "image=${image}"
          echo "image=${image}" >> $GITHUB_OUTPUT
          echo "operator_version=${operator_version}"
          echo "operator_version=${operator_version}" >> $GITHUB_OUTPUT
      - uses: actions/checkout@v7
      - uses: ./.github/actions/load-manager-image
      - id: check-image
        name: Check whether image exists
        shell: bash
        env:
          LOCAL_IMAGE: ${{ steps.get-image.outputs.image }}
        run: |
          image_id=$(docker images -q "${LOCAL_IMAGE}")
          if [ -z "${image_id}" ]; then
            echo "Image does not exist"
            exit 1
          fi

  unit-tests:
    name: Unit, integration tests & lint
    needs: [ get-image ]
    uses: ./.github/workflows/call-unit-lint.yaml
    secrets: inherit

  istio-e2e-test-k3d:
    name: Istio E2E test K3D
    runs-on: ubuntu-latest
    needs: [ get-image ]
    strategy:
      fail-fast: false
      matrix:
        test-make-target:
          - "installation-e2e-test"
          - "configuration-e2e-test"
          - "mesh_communication-e2e-test"
          - "observability-e2e-test"
          - "extauth-e2e-test"
          - "egress-e2e-test"
          - "trustdomain-e2e-test"
          - "networkpolicy-e2e-test"
          - "dnsproxying-e2e-test"
          - "proxystats-e2e-test"
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/load-manager-image
      - uses: ./.github/actions/e2e-test-k3d
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          test_make_target: ${{ matrix.test-make-target }}
          operator-image-name: ${{ needs.get-image.outputs.image }}
          operator-version: ${{ needs.get-image.outputs.operator_version }}
          k3d_configuration: 'default'

  istio-e2e-test-evaluation-k3d:
    name: Istio E2E test (evaluation) K3D
    runs-on: ubuntu-latest
    needs: [ get-image ]
    strategy:
      fail-fast: false
      matrix:
        test-make-target: [ "evaluation-e2e-test" ]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/load-manager-image
      - uses: ./.github/actions/e2e-test-k3d
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          test_make_target: ${{ matrix.test-make-target }}
          operator-image-name: ${{ needs.get-image.outputs.image }}
          operator-version: ${{ needs.get-image.outputs.operator_version }}
          k3d_configuration: 'evaluation'

  istio-e2e-test-calico-k3d:
    name: Istio E2E test (Calico) K3D
    runs-on: ubuntu-latest
    needs: [ get-image ]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/load-manager-image
      - uses: ./.github/actions/e2e-test-k3d
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          test_make_target: "networkpolicy-e2e-test"
          operator-image-name: ${{ needs.get-image.outputs.image }}
          operator-version: ${{ needs.get-image.outputs.operator_version }}
          k3d_configuration: 'calico'

  istio-e2e-test-experimental-k3d:
    name: Istio E2E test (experimental) K3D
    runs-on: ubuntu-latest
    needs: [ get-image ]
    strategy:
      fail-fast: false
      matrix:
        test-make-target: [ "ambient-e2e-test" ]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/load-manager-image-experimental
      - uses: ./.github/actions/e2e-test-k3d
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          test_make_target: ${{ matrix.test-make-target }}
          operator-image-name: ${{ needs.get-image.outputs.image }}-experimental
          operator-version: ${{ needs.get-image.outputs.operator_version }}
          k3d_configuration: 'default'

  istio-upgrade-test-k3d:
    name: Istio upgrade test K3D
    runs-on: ubuntu-latest
    needs: [ get-image ]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/load-manager-image
      - uses: ./.github/actions/upgrade-test-k3d
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_BRANCH: ${{ github.base_ref }}
        with:
          test_make_target: "upgrade-test"
          operator-version: ${{ needs.get-image.outputs.operator_version }}
          operator-image-name: ${{ needs.get-image.outputs.image }}
          k3d_configuration: 'default'

  verify-pins:
    name: Dispatch verify-commit-pins
    uses: ./.github/workflows/call-verify-commit-pins.yaml
    secrets: inherit

  pull-request-status:
    needs:
      - detect-scope
      - check-docs
      - check-images
      - build-image
      - unit-tests
      - istio-e2e-test-k3d
      - istio-e2e-test-evaluation-k3d
      - istio-e2e-test-calico-k3d
      - istio-e2e-test-experimental-k3d
      - istio-upgrade-test-k3d
      - verify-pins
    runs-on: ubuntu-latest
    if: always()
    steps:
      - if: ${{ contains(needs.*.result, 'failure') }}
        run: |
          echo "Some jobs failed"
          exit 1
      - if: ${{ contains(needs.*.result, 'cancelled') }}
        run: |
          echo "Some jobs were cancelled"
          exit 1
      - run: echo "All jobs passed"