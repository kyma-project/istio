name: Istio Version Upgrade

# Scheduled Istio upgrade. Runs every morning (and on manual dispatch),
# reads the already-synced target version from the in-repo image manifests
# (external-images.yaml / fips-images.yaml, kept current by the image updater),
# repoints the operator + Go dependency + release note, and opens a PR to main
# and the active release branch. It never triggers on push; the images it adopts
# must already be mirrored, which is guaranteed once an image-update PR is merged.

permissions:
  contents: write
  pull-requests: write

on:
  schedule:
    - cron: "40 6 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  discover-target-branches:
    name: Discover target branches
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.discover.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Build branch matrix
        id: discover
        shell: bash
        run: |
          set -euo pipefail

          git fetch --prune origin '+refs/heads/*:refs/remotes/origin/*'

          latest_release="$(git for-each-ref --format='%(refname:short)' refs/remotes/origin/release-* \
            | sed 's#^origin/##' \
            | sort -V \
            | tail -n 1)"

          if [ -n "${latest_release}" ]; then
            matrix="{\"include\":[{\"base\":\"main\"},{\"base\":\"${latest_release}\"}]}"
          else
            matrix='{"include":[{"base":"main"}]}'
          fi

          echo "matrix=${matrix}" >> "$GITHUB_OUTPUT"

  upgrade-istio:
    name: Upgrade Istio on ${{ matrix.base }}
    runs-on: ubuntu-latest
    needs: discover-target-branches
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.discover-target-branches.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ matrix.base }}
          fetch-depth: 0 # full history + tags: release-note draft/create detection reads tags

      - uses: actions/setup-go@v7
        with:
          go-version-file: "go.mod"

      - name: Perform Istio upgrade
        id: upgrade
        shell: bash
        env:
          BASE_BRANCH: ${{ matrix.base }}
        run: bash ./hack/ci/upgrade-istio.sh

      - name: Commit and create pull request
        if: steps.upgrade.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ vars.ACTIONS_BOT_NAME }}
          EMAIL: ${{ vars.ACTIONS_BOT_EMAIL }}
          ISTIO_VERSION: ${{ steps.upgrade.outputs.istio_version }}
          ANNOUNCE_URL: ${{ steps.upgrade.outputs.announce_url }}
        shell: bash
        run: |
          set -euo pipefail

          branch="autobump/istio-upgrade-${{ matrix.base }}"
          title="Bump Istio to ${ISTIO_VERSION} (${{ matrix.base }})"

          git config user.name "${USERNAME}"
          git config user.email "${EMAIL}"

          git checkout -B "${branch}"
          git add config/manager/env-images.yaml \
                  internal/istiooperator/istio-operator.yaml \
                  internal/istiooperator/istio-operator-light.yaml \
                  docs/release-notes go.mod go.sum
          git commit -m "Bump Istio to ${ISTIO_VERSION}"
          git push -f -u origin "${branch}"

          {
            echo '## Automated Istio version upgrade'
            echo
            echo "- Base branch: \`${{ matrix.base }}\`"
            echo "- Istio version: \`${ISTIO_VERSION}\`"
            echo "- Istio changelog: ${ANNOUNCE_URL}"
            echo "- Workflow run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo
            echo 'Repoints `env-images.yaml` and the operator manifests at the synced images, bumps the `istio.io/istio` Go dependency, and adds a release note.'
          } > istio-upgrade-pr-body.md

          # Match only an OPEN PR for this head: a merged/closed one for the
          # reused branch must not divert us into editing a merged PR.
          existing="$(gh pr list --head "${branch}" --base "${{ matrix.base }}" --state open --json number --jq '.[0].number')"
          if [ -n "${existing}" ]; then
            gh pr edit "${existing}" --title "${title}" --body-file istio-upgrade-pr-body.md
          else
            gh pr create \
              --base "${{ matrix.base }}" \
              --head "${branch}" \
              --title "${title}" \
              --body-file istio-upgrade-pr-body.md
          fi
