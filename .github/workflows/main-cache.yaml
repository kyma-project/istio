name: Main cache

permissions:
  contents: read

on:
  push:
    branches:
      - main
    paths:
      - 'go.mod'

jobs:

  build-cache:
    name: Build cache
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version-file: "go.mod"
      - name: build
        run: make build

  warm-image-cache:
    name: Warm image cache
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/build-manager-image
        with:
          operator-image-name: "istio-manager:main-cache"
          operator-version: "main"
