name: Pull Request Restarter

permissions:
  contents: read

on:
  pull_request:
    types: [ synchronize, opened, reopened, ready_for_review ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

env:
  IMAGE_NAME: "istio-manager"
  RESTARTER_IMAGE_NAME: "istio-restarter"

jobs:
  build-image:
    name: Build manager image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/build-manager-image
        with:
          operator-image-name: "istio-manager:PR-${{github.event.number}}"
          operator-version: "PR-${{github.event.number}}"

  build-restarter-image:
    name: Build restarter image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/build-restarter-image
        with:
          restarter-image-name: "istio-restarter:PR-${{github.event.number}}"

  get-image:
    name: Get images
    runs-on: ubuntu-latest
    needs: [ build-image, build-restarter-image ]
    outputs:
      image: "${{ steps.get-image.outputs.image }}"
      restarter_image: "${{ steps.get-image.outputs.restarter_image }}"
      operator_version: "${{ steps.get-image.outputs.operator_version }}"
    steps:
      - id: get-image
        name: Get images for tests
        shell: bash
        env:
          PR_NUMBER: ${{github.event.number}}
        run: |
          image="${IMAGE_NAME}:PR-${PR_NUMBER}"
          restarter_image="${RESTARTER_IMAGE_NAME}:PR-${PR_NUMBER}"
          operator_version="PR-${PR_NUMBER}"
          echo "image=${image}"
          echo "image=${image}" >> $GITHUB_OUTPUT
          echo "restarter_image=${restarter_image}"
          echo "restarter_image=${restarter_image}" >> $GITHUB_OUTPUT
          echo "operator_version=${operator_version}"
          echo "operator_version=${operator_version}" >> $GITHUB_OUTPUT
      - uses: actions/checkout@v7
      - uses: ./.github/actions/load-manager-image
      - uses: ./.github/actions/load-restarter-image
      - id: check-image
        name: Check whether images exist
        shell: bash
        env:
          LOCAL_IMAGE: ${{ steps.get-image.outputs.image }}
          LOCAL_RESTARTER_IMAGE: ${{ steps.get-image.outputs.restarter_image }}
        run: |
          for img in "${LOCAL_IMAGE}" "${LOCAL_RESTARTER_IMAGE}"; do
            image_id=$(docker images -q "${img}")
            if [ -z "${image_id}" ]; then
              echo "Image ${img} does not exist"
              exit 1
            fi
          done

  istio-restarter-e2e-test-k3d:
    name: Istio Restarter E2E test K3D
    runs-on: ubuntu-latest
    needs: [ get-image ]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/load-manager-image
      - uses: ./.github/actions/load-restarter-image
      - uses: ./.github/actions/restarter-e2e-test-k3d
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          test_make_target: "restarter-e2e-test"
          operator-image-name: ${{ needs.get-image.outputs.image }}
          restarter-image-name: ${{ needs.get-image.outputs.restarter_image }}
          operator-version: ${{ needs.get-image.outputs.operator_version }}
          k3d_configuration: 'many-nodes'
