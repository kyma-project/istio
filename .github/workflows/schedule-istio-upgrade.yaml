name: Schedule Istio Upgrade

# Orchestrator for the scheduled Istio patch upgrade. It does no upgrade work
# itself: each morning (and on manual dispatch) it discovers the target
# branches (main + the supported release-*) and dispatches the worker workflow
# once per branch with --ref <branch>. Running with --ref makes the worker
# execute entirely in that branch's context - its own workflow file, its own
# hack/ci/upgrade-istio.sh, and a checkout of that branch - so no branch is
# ever read from another branch's checkout.
#
# workflow_dispatch is one of the two events (with repository_dispatch) that
# GITHUB_TOKEN is allowed to trigger, so the default token is enough here; no
# PAT/App token is needed just to fan out.

permissions:
  actions: write # required to dispatch the worker workflow via the Actions API

on:
  schedule:
    - cron: "40 6 * * *" # morning UTC, off-peak minute; after the 04:00 image updater
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  dispatch-workers:
    name: Dispatch workers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Dispatch Istio upgrade worker for each target branch
        env:
          MAINTAINED_RELEASE_BRANCHES_COUNT: ${{ vars.MAINTAINED_RELEASE_BRANCHES_COUNT }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          for branch in main $(bash hack/ci/find-maintained-release-branches.sh); do
            echo "Dispatching istio-upgrade-worker for ${branch}"
            gh workflow run istio-upgrade-worker.yaml --ref "${branch}" \
              || echo "WARNING: failed to dispatch istio-upgrade-worker for ${branch}"
          done
